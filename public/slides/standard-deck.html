<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RipiDoc Standard Slides</title>
<style>
:root{--navy:#123e73;--blue:#72b5e8;--coral:#f05b52;--ivory:#fff9f1;--ink:#17283a;--muted:#617181;--line:rgba(18,62,115,.16)}*{box-sizing:border-box}html,body,#app{width:100%;height:100%;margin:0;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:var(--ivory)}button{font:inherit;cursor:pointer}.deck{height:100%;position:relative;background:radial-gradient(circle at 10% 10%,rgba(114,181,232,.2),transparent 24%),radial-gradient(circle at 92% 90%,rgba(240,91,82,.12),transparent 19%),var(--ivory)}.slide{display:grid;position:absolute;inset:0;padding:7% 8%;gap:20px;opacity:0;pointer-events:none;transform:translateX(20px);transition:.25s ease}.slide.active{opacity:1;pointer-events:auto;transform:none}.slide::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(18,62,115,.12) 1px,transparent 1.5px);background-size:28px 28px;opacity:.22;pointer-events:none}.slide>*{position:relative}.kicker{color:var(--coral);font-weight:850;font-size:clamp(8px,1vw,14px);letter-spacing:.16em}.title{margin:0;color:var(--navy);font-size:clamp(25px,4.6vw,72px);line-height:.98;letter-spacing:-.05em}.subtitle,.body{margin:0;color:var(--muted);font-size:clamp(11px,1.6vw,23px);line-height:1.5;max-width:65%}.asset{position:absolute;right:2%;bottom:-12%;width:45%;max-height:88%;object-fit:contain;filter:drop-shadow(0 18px 18px rgba(18,62,115,.16))}.cover .title{font-size:clamp(34px,6.8vw,106px);max-width:60%}.cover .subtitle{font-size:clamp(12px,1.8vw,25px)}.chapter{align-content:center}.chapter .number{font-size:clamp(64px,15vw,230px);font-weight:900;color:rgba(18,62,115,.1);line-height:.75}.statement{align-content:center}.statement .title{max-width:80%}.card-grid,.column-grid,.insight-grid{display:grid;gap:2.1%;grid-template-columns:repeat(var(--cols,3),1fr);align-items:stretch}.card{border:1px solid var(--line);border-radius:clamp(11px,1.7vw,25px);padding:clamp(12px,1.9vw,28px);background:rgba(255,255,255,.64);box-shadow:0 1px 0 #fff inset}.card h3{margin:0 0 9px;color:var(--navy);font-size:clamp(12px,1.7vw,25px);letter-spacing:-.03em}.card p{margin:0;color:var(--muted);font-size:clamp(9px,1vw,16px);line-height:1.5}.framework-grid,.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2%;align-content:center}.framework-item,.step{border-radius:0 0 16px 16px;border-top:3px solid var(--navy);background:rgba(255,255,255,.55);padding:clamp(10px,1.4vw,22px)}.framework-item strong,.step strong{display:block;color:var(--navy);font-size:clamp(12px,1.6vw,23px);margin-bottom:6px}.framework-item span,.step span{color:var(--muted);font-size:clamp(8px,1vw,15px);line-height:1.4}.steps{grid-template-columns:repeat(var(--cols,4),1fr)}.comparison .card ul{margin:10px 0 0;padding-left:16px;color:var(--muted);font-size:clamp(8px,1vw,15px);line-height:1.5}.case .context{max-width:73%;font-size:clamp(11px,1.5vw,21px);line-height:1.45;color:var(--muted)}table{width:100%;border-collapse:separate;border-spacing:0 7px;font-size:clamp(8px,1.05vw,16px)}th{color:var(--muted);text-align:left;font-size:.82em;letter-spacing:.08em;text-transform:uppercase;padding:7px}td{background:rgba(255,255,255,.67);padding:10px;color:var(--muted)}td:first-child{border-radius:10px 0 0 10px;color:var(--navy);font-weight:750}td:last-child{border-radius:0 10px 10px 0}.closing{align-content:center}.closing .quote{color:var(--navy);font-size:clamp(13px,2vw,30px);font-weight:700;max-width:80%;margin:0}.toolbar{position:absolute;top:3%;right:3%;z-index:5;display:flex;gap:7px}.toolbar button,.nav button{border:1px solid var(--line);background:rgba(255,255,255,.78);color:var(--navy);border-radius:999px;width:clamp(28px,3vw,44px);height:clamp(28px,3vw,44px);font-weight:800}.nav{position:absolute;right:4%;bottom:4%;z-index:5;display:flex;align-items:center;gap:8px}.counter{font-size:clamp(8px,1vw,14px);color:var(--muted);min-width:42px;text-align:center}.overview{display:none;position:absolute;inset:0;z-index:6;padding:5%;overflow:auto;background:var(--ivory)}.overview.open{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-content:start}.thumb{min-height:120px;border:1px solid var(--line);border-radius:14px;background:#fffdf9;padding:15px;text-align:left;color:var(--navy)}.thumb span{display:block;color:var(--coral);font-size:10px;font-weight:800;margin-bottom:8px}.thumb strong{font-size:14px}.empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:15px}
</style>
</head>
<body><div id="app"><div class="empty">Impor XML untuk melihat deck Standard.</div></div>
<script>
(() => {
  const assets={"udang-batik":"/slides/assets/udang-batik.png","ikan-biru-melengkung":"/slides/assets/ikan-biru-melengkung.png","ikan-biru-panjang":"/slides/assets/ikan-biru-panjang.png"};
  let deck=null,current=0; const app=document.querySelector('#app');
  const node=(tag,className,text)=>{const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el};
  const addHead=(slide,data)=>{if(data.kicker)slide.append(node('div','kicker',data.kicker));if(data.number)slide.append(node('div','number',data.number));if(data.title)slide.append(node('h1','title',data.title));if(data.subtitle)slide.append(node('p','subtitle',data.subtitle));};
  const grid=(items,kind='card')=>{const box=node('div',kind==='column'?'column-grid':'card-grid');box.style.setProperty('--cols',items.length);items.forEach(item=>{const card=node('article','card');card.append(node('h3','',item.title));if(item.body)card.append(node('p','',item.body));if(item.points?.length){const list=node('ul');item.points.forEach(point=>list.append(node('li','',point)));card.append(list)}box.append(card)});return box};
  function makeSlide(data,index){const slide=node('section','slide '+data.type); slide.dataset.index=index; addHead(slide,data);
    if(data.type==='statement'&&data.body)slide.append(node('p','body',data.body));
    if(['cards','case'].includes(data.type)){if(data.context)slide.append(node('p','context',data.context));slide.append(grid(data.cards));}
    if(data.type==='framework'){const box=node('div','framework-grid');data.items.forEach(item=>{const el=node('div','framework-item');el.append(node('strong','',item.title),node('span','',item.body));box.append(el)});slide.append(box);if(data.body)slide.append(node('p','body',data.body));}
    if(data.type==='process'){const box=node('div','steps');box.style.setProperty('--cols',data.steps.length);data.steps.forEach(step=>{const el=node('div','step');el.append(node('strong','',step.label),node('span','',step.body));box.append(el)});slide.append(box);}
    if(data.type==='comparison')slide.append(grid(data.columns,'column'));
    if(data.type==='table'){const table=node('table');const head=node('thead');const headRow=node('tr');data.table.head.forEach(cell=>headRow.append(node('th','',cell)));head.append(headRow);table.append(head);const body=node('tbody');data.table.rows.forEach(row=>{const tr=node('tr');row.forEach(cell=>tr.append(node('td','',cell)));body.append(tr)});table.append(body);slide.append(table);}
    if(data.type==='closing'){slide.append(grid(data.insights));if(data.quote)slide.append(node('p','quote','“'+data.quote+'”'));}
    if(data.asset&&assets[data.asset]){const image=document.createElement('img');image.className='asset';image.src=assets[data.asset];image.alt='';slide.append(image)} return slide;
  }
  function show(index){current=Math.max(0,Math.min(index,deck.slides.length-1));document.querySelectorAll('.slide').forEach((slide,i)=>slide.classList.toggle('active',i===current));document.querySelector('#counter').textContent=String(current+1).padStart(2,'0')+' / '+String(deck.slides.length).padStart(2,'0');}
  function render(nextDeck){deck=nextDeck;current=0;app.replaceChildren();const shell=node('main','deck');deck.slides.forEach((slide,index)=>shell.append(makeSlide(slide,index)));const toolbar=node('div','toolbar');const overview=node('button','', '☷');overview.title='Overview';toolbar.append(overview);const fullscreen=node('button','', '⛶');fullscreen.title='Fullscreen';toolbar.append(fullscreen);shell.append(toolbar);const navigation=node('div','nav');const prev=node('button','', '←');prev.title='Sebelumnya';const counter=node('span','counter');counter.id='counter';const next=node('button','', '→');next.title='Berikutnya';navigation.append(prev,counter,next);shell.append(navigation);const grid=node('aside','overview');deck.slides.forEach((slide,index)=>{const thumb=node('button','thumb');thumb.append(node('span','',String(index+1).padStart(2,'0')+' · '+slide.type),node('strong','',slide.title||slide.kicker||'Slide'));thumb.addEventListener('click',()=>{grid.classList.remove('open');show(index)});grid.append(thumb)});shell.append(grid);app.append(shell);prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);overview.onclick=()=>grid.classList.toggle('open');fullscreen.onclick=()=>shell.requestFullscreen?.();document.onkeydown=(event)=>{if(['ArrowRight',' '].includes(event.key)){event.preventDefault();show(current+1)}if(event.key==='ArrowLeft'){event.preventDefault();show(current-1)}if(event.key.toLowerCase()==='o')grid.classList.toggle('open')};show(0);}
  window.addEventListener('message',event=>{if(event.data?.type==='ripidoc-slide-deck')render(event.data.deck)});
})();
</script></body></html>
